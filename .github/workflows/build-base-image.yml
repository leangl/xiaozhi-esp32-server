name: Build Base Image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Source-built server-base image by digest
        value: ${{ jobs.build-base.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.identity.outputs.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate explicit Python image input
        env:
          PYTHON_IMAGE: ${{ vars.PYTHON_IMAGE }}
        run: python tools/build-inputs.py images --python-image "$PYTHON_IMAGE"
      - name: Record source inputs (not an installed SBOM)
        run: python tools/build-inputs.py report > source-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: base-source-inputs
          path: source-inputs.json
      - name: Owned repository identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build this checkout's dependency base without a warm layer cache
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server-base
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.identity.outputs.repository }}:server-base-${{ github.sha }}
          provenance: mode=max
          build-args: |
            PYTHON_IMAGE=${{ vars.PYTHON_IMAGE }}
