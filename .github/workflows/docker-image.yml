name: Docker Image CI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/build-base-image.yml
  release:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate explicit web inputs before any package install
        env:
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
          MAVEN_IMAGE: ${{ vars.MAVEN_IMAGE }}
          RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
          NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
        run: |
          python tools/build-inputs.py images --node-image "$NODE_IMAGE" --maven-image "$MAVEN_IMAGE" --runtime-image "$RUNTIME_IMAGE"
          test "$NPM_REGISTRY" = https://registry.npmjs.org
          node tools/build-npm-lock.mjs main/manager-web/package-lock.json
      - name: Record source inputs (not an installed SBOM)
        run: python tools/build-inputs.py report > source-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-source-inputs
          path: source-inputs.json
      - name: Owned repository identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server from the base produced from the same checkout
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.identity.outputs.repository }}:server-${{ github.sha }}
          provenance: mode=max
          build-args: |
            SERVER_BASE_IMAGE=${{ needs.base.outputs.image }}
      - name: Build management services from source
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-web
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.identity.outputs.repository }}:web-${{ github.sha }}
          provenance: mode=max
          build-args: |
            NODE_IMAGE=${{ vars.NODE_IMAGE }}
            MAVEN_IMAGE=${{ vars.MAVEN_IMAGE }}
            RUNTIME_IMAGE=${{ vars.RUNTIME_IMAGE }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY }}
      - name: Record produced image digests
        env:
          BASE: ${{ needs.base.outputs.image }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          printf '%s\n' "$BASE" "$REPOSITORY@$SERVER_DIGEST" "$REPOSITORY@$WEB_DIGEST" > image-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image-digests
          path: image-digests.txt
