# Install the server with Docker.

services:
  xiaozhi-esp32-server:
    image: ${SERVER_IMAGE:?Set a unique locally source-built server image}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile-server
      args:
        SERVER_BASE_IMAGE: ${SERVER_BASE_IMAGE:?Build Dockerfile-server-base from this checkout first}
    restart: "no"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      # WebSocket server.
      - "127.0.0.1:${SERVER_WS_PORT:-18000}:8000"
      # HTTP port for simple OTA (server-only deployments) and vision analysis.
      - "127.0.0.1:${SERVER_HTTP_PORT:-18003}:8003"
    volumes:
      # Configuration directory.
      - ${CANDIDATE_DATA_DIR:?Set a new isolated candidate configuration directory}:/opt/xiaozhi-esp32-server/data
