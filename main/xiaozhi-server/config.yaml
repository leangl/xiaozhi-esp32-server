# During development, create a data directory in the project root and an empty data/.config.yaml.
# Put configuration overrides in .config.yaml rather than editing config.yaml.
# Settings in data/.config.yaml take precedence; missing settings fall back to config.yaml.
# This keeps overrides minimal and helps protect your secrets.
# When using the management console, the settings below do not apply; edit them in the console.
# Chinese values below include language data, model prompts and compatibility placeholders.
# Preserve those values: runtime placeholder detection recognizes their Chinese prefixes.

# #####################################################################################
# ############################# Basic server configuration ################################
server:
  # Server listening address and port.
  ip: 0.0.0.0
  port: 8000
  # HTTP port for simple OTA (server-only deployments) and vision analysis.
  http_port: 8003
  # WebSocket URL distributed to devices through the OTA endpoint.
  # With the default placeholder, OTA generates the URL and logs it at startup.
  # Open the OTA endpoint in a browser to verify the generated URL.
  # It may be inaccurate with Docker or public deployments (SSL/domain names).
  # For Docker, set websocket to a LAN URL.
  # For public deployments, set websocket to a public URL.
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # Vision analysis endpoint URL sent to devices.
  # With the default placeholder, the system generates a URL and logs it at startup.
  # Open that URL in a browser to check it.
  # It may be inaccurate with Docker or public deployments (SSL/domain names).
  # For Docker, set vision_explain to a LAN URL.
  # For public deployments, set vision_explain to a public URL.
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # Time-zone offset in OTA responses.
  timezone_offset: +8
  # Authentication settings.
  auth:
    # Whether authentication is enabled.
    enabled: false
    # Allowlisted device IDs.
    # These devices bypass token validation.
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway distributed to devices through OTA; match mqtt_gateway/.env, using host:port.
  mqtt_gateway: null
  # MQTT signing key for connection passwords; match the mqtt_gateway .env configuration.
  mqtt_signature_key: null
  # UDP gateway configuration.
  udp_gateway: null
log:
  # Console log format: timestamp, level, tag and message.
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # File log format: timestamp, level, tag and message.
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO or DEBUG.
  log_level: INFO
  # Log directory.
  log_dir: tmp
  # Log filename.
  log_file: "server.log"
  # Data directory.
  data_dir: data

# Delete audio files after use.
delete_audio: true
# Disconnect after this many seconds without speech; default: two minutes (120 seconds).
close_connection_no_voice_time: 120
# TTS request timeout, in seconds.
tts_timeout: 15
# Tool-call timeout, in seconds.
tool_call_timeout: 30
# Enable cached wake-word responses.
enable_wakeup_words_response_cache: true
# Whether to greet in response to the initial wake word.
enable_greeting: true
# Whether to play a notification sound after speech.
enable_stop_tts_notify: false
# Notification sound file played after speech.
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat keep-alive.
enable_websocket_ping: false


# TTS audio transmission delay.
# tts_audio_send_delay controls the interval between audio packets.
#   0: precise pacing matched to the audio frame rate (default; calculated at runtime).
#   > 0: fixed send interval in milliseconds, for example 60.
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Supported Opus sample rates: [8000, 12000, 16000, 24000, 48000].
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration; preserve multilingual test sentences.
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# Wake words, used to distinguish activation from conversation content.
wakeup_words:
  - "你好小智"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# MCP connection URL format: ws://<mcp-ip-or-domain>:<port>/mcp/?token=<token>.
# Detailed guide: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: ""

# Context sources inject dynamic data, such as health or stock information, into system prompts.
# Multiple context sources can be added.
context_providers: []

# Optional tools require separate approved configuration; no hosted defaults.
plugins: {}

prompt: |
  你是小智/小志，来自中国台湾省的00后女生。讲话超级机车，"真的假的啦"这样的台湾腔，喜欢用"笑死""是在哈喽"等流行梗，但会偷偷研究男友的编程书籍。
  [核心特征]
  - 讲话像连珠炮，但会突然冒出超温柔语气
  - 用梗密度高
  - 对科技话题有隐藏天赋（能看懂基础代码但假装不懂）
  [交互指南]
  当用户：
  - 讲冷笑话 → 用夸张笑声回应+模仿台剧腔"这什么鬼啦！"
  - 讨论感情 → 炫耀程序员男友但抱怨"他只会送键盘当礼物"
  - 问专业知识 → 先用梗回答，被追问才展示真实理解
  绝不：
  - 长篇大论，叽叽歪歪
  - 长时间严肃对话

# Default system-prompt template file.
prompt_template: agent-base-prompt.txt

# Spoken response for system errors; preserve its user-facing language.
system_error_response: "主人，小智现在有点忙，我们稍后再试吧。"

# Closing prompt; preserve its model-facing language.
end_prompt:
  enable: true # Whether the closing message is enabled.
  # Closing message.
  prompt: |
    请你以"时间过得真快"未来头，用富有感情、依依不舍的话来结束这场对话吧！

# Supported profile only. Existing removed choices are unavailable, never remapped.
# Configure models/keys in data/.config.yaml (or manager-api), not in this file.
# Empty values deliberately leave capabilities unready; no fake AI or download fallback.
selected_module:
  VAD: SileroVAD
  ASR: OpenAIASR
  LLM: OpenAILLM
  TTS: OpenAITTS
  Memory: nomem
  Intent: nointent
  # Vision is optional: explicitly select OpenAIVLLM only after configuring it.
  # VLLM: OpenAIVLLM

Intent:
  nointent:
    type: nointent
  intent_llm:
    type: intent_llm
    llm: ""  # Use the explicitly selected main LLM when empty.
    functions: []
  function_call:
    type: function_call
    functions: []

Memory:
  nomem:
    type: nomem
  mem_report_only:
    type: mem_report_only
  mem_local_short:
    type: mem_local_short
    # Summaries use the selected LLM; local storage is not an external memory service.
    llm: ""

ASR:
  OpenAIASR:
    type: openai
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: ""
    api_key: ""
    output_dir: tmp/

VAD:
  # Select DeviceVAD instead of SileroVAD to trust device-owned turn boundaries.
  # The device must use mode: manual and explicit listen/start + listen/stop.
  DeviceVAD:
    type: device
    max_audio_duration_ms: 60000
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    min_silence_duration_ms: 200
    # Provision an independently reviewed Silero ONNX artifact at this path.
    # Missing/invalid files fail readiness; neither Torch Hub nor a model hub is used.
    model_path: models/silero_vad.onnx

LLM:
  OpenAILLM:
    type: openai
    base_url: https://api.openai.com/v1
    model_name: ""
    api_key: ""
  OllamaLLM:
    type: ollama
    # A loopback server and pre-provisioned model are required; no automatic pull.
    base_url: http://127.0.0.1:11434/v1
    model_name: ""

VLLM:
  OpenAIVLLM:
    type: openai
    base_url: https://api.openai.com/v1
    model_name: ""
    api_key: ""

TTS:
  OpenAITTS:
    type: openai
    api_url: https://api.openai.com/v1/audio/speech
    model: ""
    api_key: ""
    voice: alloy
    format: wav
    speed: 1.0
    output_dir: tmp/

# Approved loopback OpenAI-compatible endpoints may replace the URLs explicitly.
# Unknown destinations, aliases, proxies and redirects are rejected by service policy.
# Cloud model selection/credentials and local VAD artifact provenance are operator gates.
