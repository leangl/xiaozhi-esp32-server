# Install all modules with Docker.

services:
  # Server module.
  xiaozhi-esp32-server:
    image: ${SERVER_IMAGE:?Set a unique locally source-built server image}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile-server
      args:
        SERVER_BASE_IMAGE: ${SERVER_BASE_IMAGE:?Build Dockerfile-server-base from this checkout first}
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: "no"
    networks:
      - default
    ports:
      # WebSocket server.
      - "127.0.0.1:${SERVER_WS_PORT:-18000}:8000"
      # HTTP service port for vision analysis.
      - "127.0.0.1:${SERVER_HTTP_PORT:-18003}:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # Configuration directory.
      - ${CANDIDATE_DATA_DIR:?Set a new isolated candidate configuration directory}:/opt/xiaozhi-esp32-server/data

  # manager-api and manager-web modules.
  xiaozhi-esp32-server-web:
    image: ${WEB_IMAGE:?Set a unique locally source-built web image}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile-web
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set a reviewed Docker Hub Node image digest}
        MAVEN_IMAGE: ${MAVEN_IMAGE:?Set a reviewed Docker Hub Maven image digest}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Set a reviewed Liberica runtime image digest}
        NPM_REGISTRY: ${NPM_REGISTRY:?Review and explicitly select the official npm registry}
    restart: "no"
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # Management console.
      - "127.0.0.1:${MANAGER_PORT:-18002}:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${CANDIDATE_DB_PASSWORD:?Set a disposable candidate DB password}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      # Configuration directory.
      - candidate_uploads:/uploadfile
  # Database module.
  xiaozhi-esp32-server-db:
    image: ${MYSQL_IMAGE:?Set a reviewed docker.io/library/mysql image digest}
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: "no"
    networks:
      - default
    expose:
      - 3306
    volumes:
      - candidate_mysql:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${CANDIDATE_DB_PASSWORD:?Set a disposable candidate DB password}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # Redis module.
  xiaozhi-esp32-server-redis:
    image: ${REDIS_IMAGE:?Set a reviewed docker.io/library/redis image digest}
    expose:
      - 6379
    restart: "no"
    volumes:
      - candidate_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
networks:
  default:
volumes:
  candidate_mysql:
  candidate_redis:
  candidate_uploads:
