# For a lightweight xiaozhi-server installation using local configuration only,
# ignore this file; no changes here are needed.
# To load configuration from manager-api, follow these steps:
# Copy this file to xiaozhi-server/data (create the directory if needed), naming it .config.yaml.
# Back up and review an existing data/.config.yaml; do not delete credentials or user settings.
# Start manager-api and manager-web, then register an account. The first account is the administrator.
# As administrator, open Parameter Management and copy the value of server.secret.
# Note: server.secret changes on each fresh deployment.
# In data/.config.yaml, set manager-api.secret to the server.secret value you copied.
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port for the vision analysis endpoint.
  http_port: 8003
  # Vision analysis endpoint URL sent to devices.
  # With the default placeholder below, the system generates a URL and logs it at startup.
  # You can open that URL in a browser to check it.
  # The generated URL may be inaccurate with Docker or public deployments (SSL/domain names).
  # For Docker, set vision_explain to a LAN URL.
  # For a public deployment, set vision_explain to a public URL.
  # Keep this Chinese placeholder unchanged: runtime checks recognize it as unconfigured.
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
manager-api:
  # Explicit reviewed manager-api origin; only literal loopback/localhost is
  # currently permitted. Arbitrary LAN addresses and Docker hostnames are not
  # exceptions: an additional origin requires a reviewed service-policy change.
  # Configure a reachable approved origin for the deployment's network namespace.
  url: http://127.0.0.1:8002/xiaozhi
  # Your manager-api token: the server.secret value copied above.
  # Empty until explicitly provisioned; never copy a production secret into source.
  secret: ""
# Default system-prompt template file.
prompt_template: agent-base-prompt.txt

# Managed AI selections must use the supported provider profile and approved endpoints.
# Removed provider references fail validation; no credentials or model choices are migrated.
# A reviewed local Silero ONNX file must be provisioned explicitly; no model is downloaded.
